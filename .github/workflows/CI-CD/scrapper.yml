name: Build, Test y Deploy Scraper

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 1. Construir imagen y probar ejecución real en contenedor
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Construir imagen Docker para pruebas locales (x86_64)
        run: |
          docker build -t scraper-test:latest .

      - name: Ejecutar Smoke Test dentro del contenedor
        run: |
          # Si el script falla o lanza una excepción no capturada, el contenedor devuelve != 0 y el pipeline se corta
          docker run --rm -e TEST_MODE=1 scraper-test:latest

  # 2. Compilar para la Raspberry Pi (ARM64) y subir a GitHub Packages
  build-arm-and-push:
    needs: build-and-smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar QEMU para emular ARM64
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en GitHub Packages (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compilar y subir imagen ARM64 a GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3. Descarga y actualización en la Raspberry Pi
  deploy-raspberry:
    needs: build-arm-and-push
    runs-on: self-hosted  # Tu runner activo en la Pi Zero 2 W
    steps:
      - name: Iniciar sesión en el registro GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Descargar última imagen actualizada
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Limpiar imágenes antiguas sin usar
        run: |
          docker image prune -f