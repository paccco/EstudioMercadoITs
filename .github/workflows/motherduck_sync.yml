name: Sync S3 to MotherDuck

on:
  schedule:
    - cron: '0 4 * * *'  # Diario a las 04:00 UTC
  workflow_dispatch:
    inputs:
      environment:
        description: 'Selecciona el entorno de ejecución'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Set target environment
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "TARGET_ENV=prod" >> "$GITHUB_ENV"
          else
            echo "TARGET_ENV=${{ inputs.environment }}" >> "$GITHUB_ENV"
          fi

      - name: Run Bronze Ingestion Script
        env:
          ENV: ${{ env.TARGET_ENV }}
          AWS_REGION: 'eu-north-1'
          # Secretos DEV
          AWS_ACCESS_KEY_ID_DEV: ${{ secrets.AWS_ACCESS_KEY_ID_DEV }}
          AWS_SECRET_ACCESS_KEY_DEV: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}
          MOTHERDUCK_TOKEN_DEV: ${{ secrets.MOTHERDUCK_TOKEN_DEV }}
          # Secretos PROD
          AWS_ACCESS_KEY_ID_PROD: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          AWS_SECRET_ACCESS_KEY_PROD: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
        run: |
          echo "Ejecutando ingesta en entorno: $TARGET_ENV"
          python scripts/sync_bronze.py