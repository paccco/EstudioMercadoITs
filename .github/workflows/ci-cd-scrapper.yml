name: CI/CD Scrapper

on:
  push:
    branches: [ "main", "dev" ]
    paths:
      - "scrapper/**"
      - ".github/workflows/ci-cd-scrapper.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-scrapper

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Construir imagen local para test
        run: |
          docker build -t scraper_test:latest ./scrapper

      - name: Ejecutar Smoke Test en contenedor
        run: |
          docker run --rm -e TEST_MODE=1 scraper_test:latest

  build-arm-and-push:
    needs: build-and-smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar QEMU (ARM64)
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en GitHub Packages
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compilar y publicar imagen ARM64
        uses: docker/build-push-action@v5
        with:
          context: ./scrapper
          file: ./scrapper/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-raspberry:
    needs: build-arm-and-push
    runs-on: self-hosted
    steps:
      - name: Iniciar sesión en el registro GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Descargar última imagen actualizada
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Limpiar imágenes obsoletas
        run: |
          docker image prune -f